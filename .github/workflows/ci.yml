name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      matrix:
        java: [21]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven
      - name: 'Build with Maven (coverage gate: line and branch thresholds)'
        run: mvn -B -ntp -Pcoverage clean verify
      - name: Enforce formatting (spotless)
        run: mvn -B -ntp -Pformat spotless:check
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: >-
            jcordis-core/target/site/jacoco/jacoco.xml,
            jcordis-loader/target/site/jacoco/jacoco.xml,
            jcordis-cli/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false